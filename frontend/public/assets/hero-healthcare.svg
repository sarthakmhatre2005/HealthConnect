<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Main Floating Dashboard Card -->
  <g filter="url(#dropShadow)">
    <rect x="120" y="80" width="560" height="420" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Top Header Bar -->
    <rect x="120" y="80" width="560" height="64" rx="20" fill="#f8fafc"/>
    <rect x="120" y="124" width="560" height="20" fill="#f8fafc"/>
    <line x1="120" y1="144" x2="680" y2="144" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Window controls -->
    <circle cx="156" cy="112" r="6" fill="#ef4444"/>
    <circle cx="176" cy="112" r="6" fill="#f59e0b"/>
    <circle cx="196" cy="112" r="6" fill="#10b981"/>
    <rect x="230" y="102" width="160" height="20" rx="6" fill="#e2e8f0"/>
    
    <!-- Live Pulse / Heart Rate Monitor Widget -->
    <rect x="156" y="170" width="230" height="130" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="186" cy="200" r="14" fill="#0284c7" fill-opacity="0.15"/>
    <path d="M182 200h8M186 196v8" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="210" y="204" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369a1">Pulse Vitals</text>
    
    <!-- Heartbeat Wave SVG -->
    <path d="M176 250 h20 l8 -18 l10 32 l12 -42 l10 30 l8 -12 h30" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="176" y="284" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">72 <tspan font-size="12" font-weight="500" fill="#64748b">BPM - Normal</tspan></text>

    <!-- AI Diagnostic Confidence Widget -->
    <rect x="410" y="170" width="230" height="130" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <circle cx="440" cy="200" r="14" fill="#0d9488" fill-opacity="0.15"/>
    <path d="M434 200 l4 4 l8 -8" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="464" y="204" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f766e">ML Ensemble</text>
    <text x="430" y="250" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#0f172a">98.9%</text>
    <rect x="430" y="266" width="180" height="8" rx="4" fill="#ccfbf1"/>
    <rect x="430" y="266" width="170" height="8" rx="4" fill="url(#tealGrad)"/>
    <text x="430" y="290" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Top-3 Condition Precision</text>

    <!-- Bottom Doctor Consult Banner inside Dashboard -->
    <rect x="156" y="324" width="484" height="140" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Doctor Profile Chip -->
    <circle cx="206" cy="380" r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <path d="M194 374 a12 12 0 0 1 24 0 v6 a12 12 0 0 1 -24 0 z" fill="#0284c7"/>
    <path d="M184 402 c0 -12 10 -16 22 -16 s22 4 22 16" fill="#0369a1"/>
    
    <text x="254" y="372" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Connected Care Network</text>
    <text x="254" y="394" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Verified Specialists Across 8 Disciplines Ready for Booking</text>
    
    <!-- Pill badges -->
    <rect x="254" y="412" width="94" height="24" rx="12" fill="#e0f2fe"/>
    <text x="272" y="428" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1">Cardiology</text>
    
    <rect x="356" y="412" width="94" height="24" rx="12" fill="#fef3c7"/>
    <text x="372" y="428" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309">Neurology</text>
    
    <rect x="458" y="412" width="104" height="24" rx="12" fill="#dcfce7"/>
    <text x="472" y="428" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">Dermatology</text>
  </g>

  <!-- Decorative Orbit Dots -->
  <circle cx="90" cy="180" r="16" fill="#0284c7" fill-opacity="0.2"/>
  <circle cx="710" cy="450" r="22" fill="#14b8a6" fill-opacity="0.25"/>
  <circle cx="730" cy="140" r="8" fill="#38bdf8"/>
</svg>
